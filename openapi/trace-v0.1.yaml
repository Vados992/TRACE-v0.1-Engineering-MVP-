openapi: 3.1.0
info:
  title: TRACE API
  version: 0.1.0
  summary: Provenance-first public-interest relationship explorer
  description: >-
    TRACE exposes evidence-backed entity search, entity-resolution comparison, public-source connectors,
    and graph investigation primitives. Correlation must not be represented as causation.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /entities/search:
    get:
      operationId: searchEntities
      parameters:
        - in: query
          name: q
          required: true
          schema: {type: string, minLength: 1}
        - in: query
          name: entity_type
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: Matching canonical entities
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/EntitySummary'}
  /entities/{entity_id}:
    get:
      operationId: getEntity
      parameters:
        - in: path
          name: entity_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Canonical entity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntityDetail'}
        '404': {description: Not found}
  /resolve/compare:
    post:
      operationId: compareResolutionRecords
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolutionRequest'}
      responses:
        '200':
          description: Explainable resolution score and decision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolutionResult'}
  /connectors/ted/search:
    post:
      operationId: searchTed
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TedSearchRequest'}
      responses:
        '200': {description: Raw TED Search API response}
  /connectors/gleif/search:
    get:
      operationId: searchGleif
      parameters:
        - in: query
          name: name
          required: true
          schema: {type: string, minLength: 2}
        - in: query
          name: page_size
          schema: {type: integer, minimum: 1, maximum: 100, default: 10}
      responses:
        '200': {description: Raw GLEIF JSON:API response}
  /connectors/gleif/{lei}:
    get:
      operationId: getGleifLei
      parameters:
        - in: path
          name: lei
          required: true
          schema: {type: string, minLength: 20, maxLength: 20}
      responses:
        '200': {description: GLEIF LEI record}
  /connectors/eurlex/{celex}:
    get:
      operationId: getEurLexByCelex
      parameters:
        - in: path
          name: celex
          required: true
          schema: {type: string}
        - in: query
          name: language
          schema: {type: string, default: eng}
      responses:
        '200':
          description: Content-negotiated Cellar document and provenance metadata
components:
  schemas:
    EntitySummary:
      type: object
      required: [id, entity_type, canonical_name, status]
      properties:
        id: {type: string, format: uuid}
        entity_type: {type: string}
        canonical_name: {type: string}
        jurisdiction_code: {type: [string, 'null']}
        status: {type: string}
    Identifier:
      type: object
      required: [scheme, identifier_value, verified]
      properties:
        scheme: {type: string}
        identifier_value: {type: string}
        country_code: {type: [string, 'null']}
        verified: {type: boolean}
    EntityDetail:
      allOf:
        - {$ref: '#/components/schemas/EntitySummary'}
        - type: object
          properties:
            identifiers:
              type: array
              items: {$ref: '#/components/schemas/Identifier'}
    ResolutionRecord:
      type: object
      required: [entity_type, name]
      properties:
        entity_type: {type: string, enum: [PERSON, ORGANIZATION, PUBLIC_BODY]}
        name: {type: string}
        jurisdiction_code: {type: [string, 'null']}
        address: {type: [string, 'null']}
        identifiers:
          type: object
          additionalProperties: {type: string}
        directors:
          type: array
          items: {type: string}
        incorporation_date: {type: [string, 'null'], format: date}
    ResolutionRequest:
      type: object
      required: [left, right]
      properties:
        left: {$ref: '#/components/schemas/ResolutionRecord'}
        right: {$ref: '#/components/schemas/ResolutionRecord'}
    ResolutionResult:
      type: object
      required: [score, decision, features, reasons]
      properties:
        score: {type: number, minimum: 0, maximum: 1}
        decision: {type: string, enum: [AUTO_MERGE, HUMAN_REVIEW, KEEP_SEPARATE]}
        features:
          type: object
          additionalProperties: {type: number}
        reasons:
          type: array
          items: {type: string}
    TedSearchRequest:
      type: object
      required: [query]
      properties:
        query: {type: string, minLength: 1}
        fields:
          type: array
          items: {type: string}
          default: [publication-number, notice-title, buyer-name]
        page: {type: integer, minimum: 1, default: 1}
        limit: {type: integer, minimum: 1, maximum: 250, default: 25}
        pagination_mode: {type: string, enum: [PAGE_NUMBER, ITERATION], default: PAGE_NUMBER}
        iteration_next_token: {type: [string, 'null']}
