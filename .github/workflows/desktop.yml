name: TRACE Windows and UI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate inherited installer
        shell: powershell
        run: ./desktop/windows/Test-Installer.ps1
      - name: Browser controls and responsive layout
        shell: powershell
        run: |
          npm install --prefix "$env:RUNNER_TEMP/trace-browser" --no-audit --no-fund playwright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NODE_PATH = "$env:RUNNER_TEMP/trace-browser/node_modules"
          $env:TRACE_BROWSER_CHANNEL = 'msedge'
          node tests/ui/console.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: isolated-ui-tests, path: 'logs/*.png'}
