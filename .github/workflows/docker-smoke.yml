name: TRACE-PIA containers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.lock
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python scripts/smoke.py
      - run: python scripts/demo.py > /tmp/trace-synthetic-test.json
      - name: Real browser against running application
        run: |
          npm install --prefix /tmp/trace-browser --no-audit --no-fund playwright
          /tmp/trace-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/trace-browser/node_modules node tests/ui/live.cjs
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Remove CI containers
        if: always()
        run: docker compose down -v
  production-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock
      - run: python scripts/bootstrap_production.py
      - run: docker compose --env-file .env.production -f compose.production.yml config --quiet
      - run: docker compose --env-file .env.production -f compose.production.yml up --build -d --wait --wait-timeout 180
      - run: python scripts/production_smoke.py
      - name: Backup and restore drill
        run: |
          mkdir -p .artifacts/backups
          docker compose --env-file .env.production -f compose.production.yml -f compose.ops.yml --profile ops run --rm backup
          docker compose --env-file .env.production -f compose.production.yml -f compose.ops.yml --profile ops up -d restore-postgres
          docker compose --env-file .env.production -f compose.production.yml -f compose.ops.yml --profile ops run --rm restore-drill
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env.production -f compose.production.yml logs --no-color --tail=200
      - name: Remove CI containers
        if: always()
        run: docker compose --env-file .env.production -f compose.production.yml -f compose.ops.yml --profile ops down -v --remove-orphans
