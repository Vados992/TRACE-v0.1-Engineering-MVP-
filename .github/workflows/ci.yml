name: TRACE-PIA CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: services/api
      EVIDENCE_BACKEND: filesystem
      EVIDENCE_DIRECTORY: .artifacts/evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.lock
      - run: ruff check services/api/app scripts services/api/tests tests/integration
      - run: python -m compileall -q services/api scripts
      - run: pytest -q -m 'not integration'
      - run: python scripts/export_openapi.py && git diff --exit-code openapi/trace-pia.json
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: trace, POSTGRES_PASSWORD: trace_ci_only, POSTGRES_DB: trace_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trace -d trace_test"
          --health-interval 3s --health-retries 30
    env:
      PYTHONPATH: services/api
      TRACE_ENV: dev
      TRACE_INTEGRATION: '1'
      DATABASE_URL: postgresql://trace:trace_ci_only@127.0.0.1:5432/trace_test
      EVIDENCE_BACKEND: filesystem
      EVIDENCE_DIRECTORY: .artifacts/evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.lock
      - run: python scripts/migrate.py
      - run: python scripts/migrate.py
      - run: pytest -q tests/integration
