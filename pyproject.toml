[project]
name = "trace-mvp"
version = "0.1.0"
description = "TRACE v0.1 provenance-first public-interest relationship explorer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "neo4j>=5.25,<6",
  "orjson>=3.10,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1"
]

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["services/api/tests"]

[tool.ruff]
line-length = 100
