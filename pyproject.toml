[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-pia"
version = "0.7.0"
description = "TRACE-PIA provenance-first public integrity reference implementation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1,<2",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "neo4j>=5.25,<6",
  "orjson>=3.10,<4",
  "minio>=7.2,<8"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
  "pyyaml>=6,<7"
]

[tool.setuptools]
package-dir = {"" = "services/api"}

[tool.setuptools.packages.find]
where = ["services/api"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["services/api/tests", "tests/integration"]
markers = ["integration: requires a migrated disposable PostgreSQL database"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
